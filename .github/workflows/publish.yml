name: release-kit / publish

# Gathers the artifacts produced by the project's build CI, extracts the
# release notes from the CHANGELOG and creates the GitHub release for the tag.
# Re-runnable: if the release already exists, its notes and files are updated.
#
# The caller must grant `permissions: contents: write`.

on:
  workflow_call:
    inputs:
      tag:
        description: Release tag (needs.<tag job>.outputs.tag).
        type: string
        required: true
      prerelease:
        description: Publish as a pre-release (not marked "latest").
        type: boolean
        required: true
      title:
        description: Release title. Defaults to "<repo name> <tag>".
        type: string
        default: ""
      artifact-pattern:
        description: Artifacts to attach to the release (glob on their name).
        type: string
        default: release-*
      changelog:
        description: Path of the CHANGELOG in the repo.
        type: string
        default: CHANGELOG.md
      require-changelog:
        description: Fail if the CHANGELOG has no section for this tag (otherwise just a warning).
        type: boolean
        default: false
      kit-ref:
        description: release-kit version whose scripts are used.
        type: string
        default: v1

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      PRERELEASE: ${{ inputs.prerelease }}
      TITLE: ${{ inputs.title || format('{0} {1}', github.event.repository.name, inputs.tag) }}
      CHANGELOG: ${{ inputs.changelog }}
      REQUIRE_CHANGELOG: ${{ inputs.require-changelog }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: Spatulox/release-kit
          ref: ${{ inputs.kit-ref }}
          path: .release-kit

      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.artifact-pattern }}
          path: dist
          merge-multiple: true

      - name: Files to publish
        env:
          PATTERN: ${{ inputs.artifact-pattern }}
        run: |
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "::error::No files in the '$PATTERN' artifacts: the build CI must upload them under that name"
            exit 1
          fi
          ls -l dist

      - name: Notes from ${{ inputs.changelog }}
        run: |
          if ! bash .release-kit/scripts/changelog.sh "$TAG" "$CHANGELOG" > notes.md || [ ! -s notes.md ]; then
            if [ "$REQUIRE_CHANGELOG" = true ]; then
              echo "::error::No '## $TAG' section in $CHANGELOG"
              exit 1
            fi
            echo "::warning::No '## $TAG' section in $CHANGELOG"
            echo "No release notes for $TAG." > notes.md
          fi
          cat notes.md

      - name: GitHub release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Workflow re-run: update the existing release
            gh release edit "$TAG" --title "$TITLE" --notes-file notes.md --prerelease="$PRERELEASE"
            gh release upload "$TAG" dist/* --clobber
          else
            flags=(--title "$TITLE" --notes-file notes.md --verify-tag)
            if [ "$PRERELEASE" = true ]; then
              flags+=(--prerelease --latest=false)
            else
              flags+=(--latest)
            fi
            gh release create "$TAG" "${flags[@]}" dist/*
          fi
          echo "### :rocket: [$TITLE]($(gh release view "$TAG" --json url -q .url))" >> "$GITHUB_STEP_SUMMARY"
