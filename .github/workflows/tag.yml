name: release-kit / tag

# Decodes the pushed tag (vX.Y.Z_alpha, vX.Y.Z_beta, vX.Y.Z_rc, vX.Y.Z_release or vX.Y.Z) and
# exposes it to the next jobs. An invalid tag fails the release here,
# before any build, and so does a CHANGELOG with no section for the tag when
# `require-changelog: true`.
#
# Dry run: a run that is not a tag push (workflow_dispatch, pull_request...)
# and gets no `tag` input receives a dev version (v1.2.0_dev.42, debversion
# 1.2.0+dev.42.gabc1234) and `dry-run` = "true": the build runs, publishing is skipped
# (`if: needs.tag.outputs.dry-run != 'true'` on the publish job).

on:
  workflow_call:
    inputs:
      tag:
        description: Tag to decode. Defaults to the tag that triggered the run (otherwise, dry run).
        type: string
        default: ""
      require-changelog:
        description: Fail here, before the build, if the CHANGELOG has no (non-empty) section for the tag.
        type: boolean
        default: false
      changelog:
        description: Path of the CHANGELOG in the repo (with require-changelog).
        type: string
        default: CHANGELOG.md
      kit-ref:
        description: release-kit version whose scripts are used.
        type: string
        default: v1
    outputs:
      tag:
        description: The tag, e.g. v1.2.0_beta
        value: ${{ jobs.parse.outputs.tag }}
      version:
        description: The bare version, e.g. 1.2.0
        value: ${{ jobs.parse.outputs.version }}
      channel:
        description: alpha, beta, rc or release (dev in a dry run)
        value: ${{ jobs.parse.outputs.channel }}
      prerelease:
        description: '"true" except for the release channel'
        value: ${{ jobs.parse.outputs.prerelease }}
      debversion:
        description: Debian-style version, e.g. 1.2.0~beta
        value: ${{ jobs.parse.outputs.debversion }}
      dry-run:
        description: '"true" for a dry run (not a tag): do not publish'
        value: ${{ jobs.parse.outputs.dry-run }}

jobs:
  parse:
    name: Decode the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      version: ${{ steps.parse.outputs.version }}
      channel: ${{ steps.parse.outputs.channel }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      debversion: ${{ steps.parse.outputs.debversion }}
      dry-run: ${{ steps.parse.outputs.dry-run }}
    env:
      DRY_RUN: ${{ inputs.tag == '' && github.ref_type != 'tag' }}
    steps:
      # The project's repo first: its checkout would wipe .release-kit. In a dry run,
      # with the history and tags, to start from the latest version.
      - uses: actions/checkout@v7
        if: inputs.require-changelog || env.DRY_RUN == 'true'
        with:
          fetch-depth: ${{ env.DRY_RUN == 'true' && '0' || '1' }}

      - uses: actions/checkout@v7
        with:
          repository: Spatulox/release-kit
          ref: ${{ inputs.kit-ref }}
          path: .release-kit

      - id: parse
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ "$DRY_RUN" = true ]; then
            script=(dev-version.sh "$GITHUB_RUN_NUMBER" "$GITHUB_SHA")
            title="Dry run (nothing published)"
          else
            script=(parse-tag.sh "$TAG")
            title="Release \`$TAG\`"
          fi
          if ! fields="$(bash ".release-kit/scripts/${script[0]}" "${script[@]:1}" 2>&1)"; then
            echo "::error::$fields"
            exit 1
          fi
          fields+=$'\n'"dry-run=$DRY_RUN"
          echo "$fields" >> "$GITHUB_OUTPUT"
          {
            echo "### $title"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "$fields" | sed 's/^\([^=]*\)=\(.*\)$/| \1 | `\2` |/'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: CHANGELOG section
        if: inputs.require-changelog && env.DRY_RUN != 'true'
        env:
          TAG: ${{ steps.parse.outputs.tag }}
          CHANGELOG: ${{ inputs.changelog }}
        run: |
          if ! bash .release-kit/scripts/changelog.sh "$TAG" "$CHANGELOG" > notes.md || [ ! -s notes.md ]; then
            echo "::error::No '## $TAG' section (nor '## v<version>', nor '## <version>') in $CHANGELOG: nothing is built"
            exit 1
          fi
          cat notes.md
