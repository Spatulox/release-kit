# À copier dans <projet>/.github/workflows/release.yml (rien à modifier, sauf le titre).
#
# Pousser un tag vX.Y.Z_beta, vX.Y.Z_rc, vX.Y.Z_release (ou vX.Y.Z) :
#   1. release-kit décode le tag,
#   2. la CI propre au projet (build.yml) construit les livrables,
#   3. release-kit crée la release GitHub avec la section du CHANGELOG.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  tag:
    uses: Spatulox/release-kit/.github/workflows/tag.yml@v1
    # with:
    #   require-changelog: true   # échoue avant le build sans section dans CHANGELOG.md

  build:
    needs: tag
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      version: ${{ needs.tag.outputs.version }}
      channel: ${{ needs.tag.outputs.channel }}
      debversion: ${{ needs.tag.outputs.debversion }}

  publish:
    needs: [tag, build]
    uses: Spatulox/release-kit/.github/workflows/publish.yml@v1
    with:
      tag: ${{ needs.tag.outputs.tag }}
      prerelease: ${{ needs.tag.outputs.prerelease == 'true' }}
      # title: MonProjet ${{ needs.tag.outputs.tag }}   # défaut : "<nom du repo> <tag>"
      # require-changelog: true                         # défaut : simple warning
