# Copy to <project>/.github/workflows/release.yml (nothing to change, except the title).
#
# Push a tag vX.Y.Z_alpha, vX.Y.Z_beta, vX.Y.Z_rc, vX.Y.Z_release (or vX.Y.Z):
#   1. release-kit decodes the tag,
#   2. the project's own CI (build.yml) builds the deliverables,
#   3. release-kit creates the GitHub release with the CHANGELOG.md section.
name: Release

on:
  push:
    tags: ['v*']
  # Dry run from the Actions tab: everything is built, nothing is published.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    uses: Spatulox/release-kit/.github/workflows/tag.yml@v1
    # with:
    #   require-changelog: true   # fail before the build without a CHANGELOG.md section

  build:
    needs: tag
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
      version: ${{ needs.tag.outputs.version }}
      channel: ${{ needs.tag.outputs.channel }}
      debversion: ${{ needs.tag.outputs.debversion }}

  publish:
    needs: [tag, build]
    if: needs.tag.outputs.dry-run != 'true'
    uses: Spatulox/release-kit/.github/workflows/publish.yml@v1
    with:
      tag: ${{ needs.tag.outputs.tag }}
      prerelease: ${{ needs.tag.outputs.prerelease == 'true' }}
      # title: MyProject ${{ needs.tag.outputs.tag }}   # default: "<repo name> <tag>"
      # require-changelog: true                         # default: just a warning
