# Copy to <project>/.github/workflows/build.yml and fill in: this is the
# project's own CI, called by release.yml once the tag is decoded.
#
# Contract:
#   - it receives the inputs below (declare only the ones it uses, and remove
#     the matching lines from the `with:` of release.yml);
#   - each file to attach to the release is uploaded in an artifact whose
#     name starts with "release-" (release-linux, release-windows, ...).
name: Build

on:
  workflow_call:
    inputs:
      tag:          # v1.2.0_beta
        type: string
        required: true
      version:      # 1.2.0
        type: string
        required: true
      channel:      # alpha | beta | rc | release (dev in a dry run)
        type: string
        required: true
      debversion:   # 1.2.0~beta
        type: string
        required: true

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Build
        run: |
          mkdir -p dist
          echo "Build the project here, version $VERSION" > "dist/my-project-$VERSION.txt"

      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: dist/*
          if-no-files-found: error
